[include fluidd.cfg]
#====================================================================
# INCLUDES
#====================================================================
[include toolhead.cfg]
[include stealthburner_leds.cfg]
[include macros.cfg]
[include extra_macro.cfg]
[include rgb_macros.cfg]
[include print_start.cfg]
[include AFC/*.cfg]

[virtual_sdcard]
path: /home/rmarin/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[exclude_object]

#====================================================================
# MCU
#====================================================================
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_330021000D50345033313820-if00

[mcu eddy]
serial: /dev/serial/by-id/usb-Klipper_rp2040_50443403108ACF1C-if00
restart_method: command

#====================================================================
# PRINTER
#====================================================================
[printer]
kinematics: corexz
max_velocity: 200
max_accel: 1000
minimum_cruise_ratio: 0.5
max_z_velocity: 50
max_z_accel: 1000
square_corner_velocity: 5.0

#====================================================================
# STEPPER X
#====================================================================
[stepper_x]
step_pin: PB13
dir_pin: PB12
enable_pin: !PB14
microsteps: 64
rotation_distance: 40
endstop_pin: ^EBBCan: gpio22
position_endstop: 219
position_min: 0
position_max: 219
homing_speed: 60
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.58
hold_current: 0.500

#====================================================================
# STEPPER Y
#====================================================================
[stepper_y]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB11
microsteps: 64
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 0
position_min: 0
position_max: 235
homing_speed: 60
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.580
hold_current: 0.500
stealthchop_threshold: 999999
diag_pin: ^PC1
driver_SGTHRS: 80

#====================================================================
# STEPPER Z
#====================================================================
[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 64
rotation_distance: 40
endstop_pin: probe:z_virtual_endstop
position_min: -3
position_max: 170
homing_speed: 60

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.58
hold_current: 0.500
stealthchop_threshold: 999999

#====================================================================
# EXTRUDER
#====================================================================
[extruder]
step_pin: EBBCan:gpio18
dir_pin: !EBBCan:gpio19
enable_pin: !EBBCan:gpio17
microsteps: 16
rotation_distance: 4.566
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBBCan:gpio7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: EBBCan:gpio27
min_temp: 0
max_temp: 280
max_extrude_only_distance: 400
max_extrude_cross_section: 10
pressure_advance: 0.01
min_extrude_temp: 180

#====================================================================
# HEATED BED
#====================================================================
[heater_bed]
heater_pin: PC9
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC4
min_temp: 0
max_temp: 130

#====================================================================
# FANS
#====================================================================
[heater_fan controller_fan]
pin: PB15
heater: heater_bed
heater_temp: 45.0

#[heater_fan nozzle_cooling_fan]
#pin: PC7

#[fan]
#pin: PC6

#====================================================================
# BTT EDDY DUO PROBE
#====================================================================
[probe_eddy_current btt_eddy]
sensor_type: ldc1612
i2c_mcu: eddy
i2c_bus: i2c0f
x_offset: 0
y_offset: 24.0
descend_z: 0.5

[temperature_sensor btt_eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: 10
max_temp: 100

#====================================================================
# HOMING
#====================================================================
[safe_z_home]
home_xy_position: 110, 117   ; center of bed
speed: 50
z_hop: 10.0
z_hop_speed: 15

#====================================================================
# BED MESH
#====================================================================
[bed_mesh]
speed: 250
mesh_min: 25, 25
mesh_max: 185, 195
probe_count: 3, 3
algorithm: bicubic

#====================================================================
# DISPLAY
#====================================================================
[display]
lcd_type: emulated_st7920
spi_software_miso_pin: PD8
spi_software_mosi_pin: PD6
spi_software_sclk_pin: PB9
en_pin: PB8
encoder_pins: ^PA10, ^PA9
click_pin: ^!PA15

[output_pin beeper]
pin: PB5

#====================================================================
# BOARD PINS
#====================================================================
[board_pins]
aliases:
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PD6, EXP1_10=<5V>

